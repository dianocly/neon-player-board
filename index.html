<!-- index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Neon Player Board</title>

  <!-- “Digital-ish” font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />

  <!-- PNG export -->
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="app" id="appRoot">
    <header class="topbar">
      <div class="topbar__left">
        <button class="icon-btn" id="togglePanel" aria-label="Toggle controls">☰</button>
        <div class="brand">
          <div class="brand__title">NEON PLAYER BOARD</div>
          <div class="brand__sub">static • browser-only • GitHub Pages-ready</div>
        </div>
      </div>

      <div class="topbar__right">
        <button class="btn" id="exportPng">Export PNG</button>
        <button class="btn" id="exportJson">Export JSON</button>

        <label class="btn btn--ghost" for="importJsonFile" role="button" tabindex="0">
          Import JSON
          <input id="importJsonFile" type="file" accept="application/json" hidden />
        </label>

        <button class="btn btn--danger" id="resetApp" title="Clears local data and resets">Reset</button>
      </div>
    </header>

    <aside class="panel" id="panel">
      <div class="panel__section panel__section--sticky">
        <button class="btn btn--primary" id="addPlayer">+ Add Player</button>

        <div class="controls">
          <label class="control">
            <div class="control__label">
              Tile size <span class="muted" id="tileSizeValue"></span>
            </div>
            <input id="tileSize" type="range" min="90" max="220" step="5" />
          </label>

          <label class="control control--inline">
            <input id="compactMode" type="checkbox" />
            <span>Compact mode</span>
          </label>

          <label class="control control--inline">
            <input id="hideEliminated" type="checkbox" />
            <span>Hide eliminated</span>
          </label>
        </div>
      </div>

      <div class="panel__section">
        <div class="panel__heading">
          <h2 class="panel__title">Players</h2>
          <div class="panel__hint">Click a tile or a player row to select.</div>
        </div>

        <div class="player-list" id="playerList" aria-label="Player editor list"></div>
      </div>

      <div class="panel__footer">
        <div class="small muted">
          Auto-saves to <code>localStorage</code>. Export JSON for backups / moving to other devices.
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="board-export" id="boardExport">
        <div class="board-export__glow"></div>
        <div class="board-export__frame">
          <div class="board-header">
            <div class="board-header__title">PLAYER GRID</div>
            <div class="board-header__meta" id="boardMeta"></div>
          </div>

          <div class="board" id="board" aria-label="Player board"></div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
